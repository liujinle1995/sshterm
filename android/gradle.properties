# 默认模板给的 -Xmx8G 超出了本机物理内存（7G），Gradle daemon 里跑 R8 时会被
# 宿主层面掐掉 / JVM JIT 崩溃。这里按本机配置收敛，并临时关掉 C2 分层编译，
# 避开 OpenJDK 17 上偶发的 JIT SIGSEGV。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:TieredStopAtLevel=1 -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
